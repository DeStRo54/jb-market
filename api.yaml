openapi: 3.0.0
paths:
  /api/auth/sign-in:
    post:
      operationId: AuthController_signIn
      parameters:
        - name: x-application
          in: header
          required: false
          schema:
            type: string
            example: web
            enum:
              - web
              - mobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInDto"
      responses:
        "200":
          description: sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
      summary: Войти
      tags:
        - 🔒 auth
  /api/auth/sign-out:
    post:
      operationId: AuthController_signOut
      parameters:
        - name: x-application
          in: header
          required: false
          schema:
            type: string
            example: web
            enum:
              - web
              - mobile
      responses:
        "200":
          description: sign-out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
      security:
        - mobile-auth: []
        - web-auth: []
      summary: Выйти
      tags:
        - 🔒 auth
  /api/users/profile:
    patch:
      operationId: UsersController_updateProfile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileDto"
      responses:
        "200":
          description: update profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProfileResponse"
      security:
        - mobile-auth: []
        - web-auth: []
      summary: Обновить профиль пользователя
      tags:
        - 💂‍♂️ users
    get:
      operationId: UsersController_getProfile
      parameters: []
      responses:
        "200":
          description: get profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProfileResponse"
      security:
        - mobile-auth: []
        - web-auth: []
      summary: Получить профиль пользователя
      tags:
        - 💂‍♂️ users
  /api/otps/otp:
    post:
      operationId: OtpsController_createOtp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOtpDto"
      responses:
        "200":
          description: create otp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOtpResponse"
      summary: Создание отп кода
      tags:
        - 🔑 otps
  /api/transactions/{id}:
    get:
      operationId: TransactionsController_getTransaction
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Получить транзакцию по ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTransactionResponse"
      summary: Получить транзакцию по ID
      tags:
        - 💸 transactions
  /api/transactions/pay:
    post:
      operationId: TransactionsController_payTransaction
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayTransactionDto"
      responses:
        "200":
          description: "Оплата транзакции: новая карта / сохранённая карта"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayTransactionResponse"
      summary: Оплатить (закрыть) транзакцию картой
      tags:
        - 💸 transactions
  /api/transactions/{id}/pay/qr:
    post:
      operationId: TransactionsController_payTransactionByQr
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Оплата транзакции по QR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayTransactionResponse"
      summary: Оплатить транзакцию по QR
      tags:
        - 💸 transactions
  /api/games/info:
    get:
      operationId: GamesController_getGames
      parameters:
        - name: filter
          required: false
          in: query
          description: Дополнительные фильтры
          schema:
            type: array
            items:
              $ref: "#/components/schemas/GameFilter"
        - name: view
          required: false
          in: query
          description: Предустановленный вид выборки
          schema:
            $ref: "#/components/schemas/GameView"
        - name: genre
          required: false
          in: query
          description: Жанр
          schema:
            type: array
            items:
              $ref: "#/components/schemas/GameGenre"
        - name: page
          required: false
          in: query
          description: Страница
          schema:
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Лимит
          schema:
            example: 10
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesPaginatedResponse"
      summary: Получить игры
      tags:
        - 🎮 games
  /api/games/search:
    get:
      operationId: GamesController_searchGames
      parameters:
        - name: search
          required: true
          in: query
          description: Строка поиска
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Лимит
          schema:
            example: 8
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSearchResponse"
      summary: Поиск по играм
      tags:
        - 🎮 games
  /api/games/info/{slug}:
    get:
      operationId: GamesController_getGame
      parameters:
        - name: slug
          required: true
          in: path
          description: Slug игры
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResponse"
      summary: Получить игру
      tags:
        - 🎮 games
  /api/games/regions:
    get:
      operationId: GamesController_getGameRegions
      parameters:
        - name: slug
          required: true
          in: query
          description: Slug игры
          schema:
            type: string
        - name: deliveryType
          required: true
          in: query
          description: Тип доставки
          schema:
            $ref: "#/components/schemas/GameDeliveryType"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRegionsResponse"
      summary: Получить регионы
      tags:
        - 🎮 games
  /api/games/price-variants:
    get:
      operationId: GamesController_getPriceVariants
      parameters:
        - name: slug
          required: true
          in: query
          description: Slug игры
          schema:
            type: string
        - name: deliveryType
          required: true
          in: query
          description: Тип доставки
          schema:
            $ref: "#/components/schemas/GameDeliveryType"
        - name: region
          required: true
          in: query
          description: Регион
          schema:
            $ref: "#/components/schemas/GameRegion"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePriceVariantsResponse"
      summary: Получить варианты цен
      tags:
        - 🎮 games
  /api/games/order:
    post:
      operationId: GamesController_createGameOrder
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameOrderDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGameOrderResponse"
      summary: Создать заказ игры и транзакцию для оплаты
      tags:
        - 🎮 games
  /api/games/orders:
    get:
      operationId: GamesController_getGameOrders
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameOrdersResponse"
      security:
        - mobile-auth: []
        - web-auth: []
      summary: Получить все заказы игр
      tags:
        - 🎮 games
  /api/games/orders/paid:
    get:
      operationId: GamesController_getGamePaidOrder
      parameters:
        - name: token
          required: true
          in: query
          description: Одноразовый токен доступа
          schema:
            example: 1f2e3d4c5b6a7980abcdef1234567890abcdef1234567890abcdef1234567890
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameOrderResponse"
      summary: Получить оплаченный заказ игры по одноразовому токену
      tags:
        - 🎮 games
  /api/games/orders/{orderId}:
    get:
      operationId: GamesController_getGameOrder
      parameters:
        - name: orderId
          required: true
          in: path
          description: ID заказа
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameOrderResponse"
      security:
        - mobile-auth: []
        - web-auth: []
      summary: Получить заказ игры
      tags:
        - 🎮 games
info:
  title: juniors bootcamp backend 🔥
  description: Апи для выполнения индивидуальных заданий
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    mobile-auth:
      scheme: bearer
      bearerFormat: Session  token
      type: http
      description: "Для x-application: mobile"
    web-auth:
      type: apiKey
      in: cookie
      name: session_token
      description: "Для x-application: web"
  schemas:
    SignInDto:
      type: object
      properties:
        phone:
          type: string
          description: Номер телефона
          example: "89990009999"
        code:
          type: number
          description: Отп код
      required:
        - phone
        - code
    User:
      type: object
      properties:
        _id:
          type: string
          description: ID пользователя
        phone:
          type: string
          description: Номер телефона
          example: "89990009999"
        firstname:
          type: string
          description: Имя
          example: Иван
        middlename:
          type: string
          description: Отчество
          example: Иванович
        lastname:
          type: string
          description: Фамилия
          example: Иванов
        email:
          type: string
          description: Почта
          example: example.email@gmail.com
        city:
          type: string
          description: Город
          example: Москва
      required:
        - _id
        - phone
    SignInResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        token:
          type: string
          description: Токен сессии
        user:
          description: Пользователь
          allOf:
            - $ref: "#/components/schemas/User"
      required:
        - success
        - token
        - user
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
      required:
        - success
    UpdateProfileDto:
      type: object
      properties:
        firstname:
          type: string
          description: Имя
          example: Иван
        middlename:
          type: string
          description: Отчество
          example: Иванович
        lastname:
          type: string
          description: Фамилия
          example: Иванов
        email:
          type: string
          description: Почта
          example: example.email@gmail.com
        city:
          type: string
          description: Город
          example: Москва
    UpdateProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        user:
          description: Пользователь
          allOf:
            - $ref: "#/components/schemas/User"
      required:
        - success
        - user
    GetProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        user:
          description: Пользователь
          allOf:
            - $ref: "#/components/schemas/User"
      required:
        - success
        - user
    CreateOtpDto:
      type: object
      properties:
        phone:
          type: string
          description: Номер телефона
          example: "89990009999"
      required:
        - phone
    CreateOtpResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        retryDelay:
          type: number
          description: Время запроса повторного отп кода в мс
          example: 120000
      required:
        - success
        - retryDelay
    TransactionOrderType:
      type: string
      enum:
        - car
        - delivery
        - pizza
        - cinema
        - game
      description: Тип заказа, связанного с транзакцией
    TransactionStatus:
      type: string
      enum:
        - pending
        - paid
        - failed
    Transaction:
      type: object
      properties:
        _id:
          type: string
          description: ID транзакции
        phone:
          type: string
          description: Телефон владельца транзакции
          example: "89990009999"
        orderId:
          type: string
          description: ID заказа, связанного с транзакцией
          nullable: true
        orderType:
          description: Тип заказа, связанного с транзакцией
          allOf:
            - $ref: "#/components/schemas/TransactionOrderType"
        amount:
          type: number
          description: Сумма транзакции
          example: 1290
        currency:
          type: string
          description: Валюта транзакции
          example: RUB
        status:
          allOf:
            - $ref: "#/components/schemas/TransactionStatus"
        expiresAt:
          format: date-time
          type: string
          description: Время истечения транзакции (createdAt + 10 мин)
        createdAt:
          format: date-time
          type: string
          description: Дата создания
        cardCryptoPacket:
          type: string
          description: Крипто-пакет карты в base64-формате
          nullable: true
        paidAt:
          format: date-time
          type: string
          description: Дата оплаты
          nullable: true
        accessToken:
          type: string
          description: Токен доступа к транзакции
          nullable: true
      required:
        - _id
        - phone
        - orderType
        - amount
        - currency
        - status
        - expiresAt
    GetTransactionResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        transaction:
          description: Транзакция
          allOf:
            - $ref: "#/components/schemas/Transaction"
      required:
        - success
        - transaction
    TransactionPayMethod:
      type: string
      enum:
        - new_card
        - saved_card
        - qr
      description: Способ оплаты
    PayTransactionDto:
      type: object
      properties:
        transactionId:
          type: string
          description: ID транзакции
        method:
          description: Способ оплаты
          example: new_card
          allOf:
            - $ref: "#/components/schemas/TransactionPayMethod"
        pan:
          type: string
          description: Номер карты (новая карта)
        expireDate:
          type: string
          description: Срок действия (новая карта)
        cardId:
          type: string
          description: ID сохранённой карты
        cvv:
          type: string
          description: CVV (любой символ — фикция)
        saveCard:
          type: boolean
          description: Сохранить новую карту
          default: true
      required:
        - transactionId
        - method
    PayTransactionResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        transaction:
          description: Оплаченная транзакция
          allOf:
            - $ref: "#/components/schemas/Transaction"
      required:
        - success
        - transaction
    GameFilter:
      type: string
      enum:
        - dlc
        - discount
    GameView:
      type: string
      enum:
        - popular
        - new
    GameGenre:
      type: string
      enum:
        - action
        - adventure
        - rpg
        - strategy
        - shooter
        - simulation
        - survival
        - sports
        - racing
        - indie
        - horror
    GameType:
      type: string
      enum:
        - game
        - dlc
      description: Тип
    GameRegion:
      type: string
      enum:
        - ru
        - kz
        - by
        - ua
        - pl
        - tr
        - all_world
        - europe
        - asia
      description: Регион
    GameDeliveryType:
      type: string
      enum:
        - steam_key
        - steam_gift
        - epic_key
        - nintendo_key
        - xbox_key
        - playstation_key
      description: Способ получения
    GamePriceVariant:
      type: object
      properties:
        region:
          description: Регион
          example: europe
          allOf:
            - $ref: "#/components/schemas/GameRegion"
        price:
          type: number
          description: Текущая цена
          example: 968
        oldPrice:
          type: number
          description: Старая цена
          example: 2688
        deliveryType:
          description: Способ получения
          example: steam_key
          allOf:
            - $ref: "#/components/schemas/GameDeliveryType"
        edition:
          type: string
          description: Издание
          example: Deluxe
      required:
        - region
        - price
        - deliveryType
        - edition
    GameFiltered:
      type: object
      properties:
        slug:
          type: string
          description: Slug игры
          example: battlefield-2042
        name:
          type: string
          description: Название игры
          example: Battlefield 2042
        releaseDate:
          type: number
          description: Дата релиза
          example: 1637280000
        type:
          description: Тип
          example: game
          allOf:
            - $ref: "#/components/schemas/GameType"
        genres:
          type: array
          description: Жанры игры
          example:
            - action
            - rpg
          items:
            $ref: "#/components/schemas/GameGenre"
        image:
          type: string
          description: Изображение игры
          example: /static/images/games/cs2.webp
        priceVariant:
          description: Наименьший вариант цены
          allOf:
            - $ref: "#/components/schemas/GamePriceVariant"
      required:
        - slug
        - name
        - releaseDate
        - type
        - genres
        - image
        - priceVariant
    GamePaginationMeta:
      type: object
      properties:
        total:
          type: number
          description: Общее количество элементов
          example: 30
        page:
          type: number
          description: Текущая страница
          example: 1
        limit:
          type: number
          description: Элементов на странице
          example: 10
        totalPages:
          type: number
          description: Количество страниц
          example: 3
      required:
        - total
        - page
        - limit
        - totalPages
    GamesPaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        games:
          description: Список игр
          type: array
          items:
            $ref: "#/components/schemas/GameFiltered"
        meta:
          description: Пагинация
          allOf:
            - $ref: "#/components/schemas/GamePaginationMeta"
      required:
        - success
        - games
        - meta
    GameSearchResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        games:
          description: Результаты поиска игр
          type: array
          items:
            $ref: "#/components/schemas/GameFiltered"
      required:
        - success
        - games
    GameSystemRequirements:
      type: object
      properties:
        oc:
          type: string
          description: Операционная система
          example: Windows 10
        processor:
          type: string
          description: Процессор
          example: Intel Core i5-9400F
        memory:
          type: string
          description: Оперативная память
          example: 16 GB
        graphics:
          type: string
          description: Видеокарта
          example: NVIDIA GeForce GTX 1660
        storage:
          type: string
          description: Место на диске
          example: 500 GB
    GameDetailed:
      type: object
      properties:
        slug:
          type: string
          description: Slug игры
          example: battlefield-2042
        name:
          type: string
          description: Название игры
          example: Battlefield 2042
        releaseDate:
          type: number
          description: Дата релиза
          example: 1637280000
        type:
          description: Тип
          example: game
          allOf:
            - $ref: "#/components/schemas/GameType"
        genres:
          type: array
          description: Жанры игры
          example:
            - action
            - rpg
          items:
            $ref: "#/components/schemas/GameGenre"
        image:
          type: string
          description: Изображение игры
          example: /static/images/games/cs2.webp
        deliveryTypes:
          type: array
          description: Способ получения
          example:
            - steam_key
            - xbox_key
            - steam_gift
          items:
            $ref: "#/components/schemas/GameDeliveryType"
        description:
          type: string
          description: Описание игры
          example: Онлайн-шутер с масштабными сражениями.
        minimumSystemRequirements:
          description: Минимальные системные требования
          allOf:
            - $ref: "#/components/schemas/GameSystemRequirements"
        recommendedSystemRequirements:
          description: Рекомендуемые системные требования
          allOf:
            - $ref: "#/components/schemas/GameSystemRequirements"
        developer:
          type: string
          description: Разработчик
          example: EA Games
        publisher:
          type: string
          description: Издатель
          example: Electronic Arts
        externalId:
          type: string
          description: Внешний ID (Steam/KupiKod)
          example: "1517290"
        screenshots:
          description: Скриншоты игры
          example:
            - /static/images/games/cs2.webp
          type: array
          items:
            type: string
      required:
        - slug
        - name
        - releaseDate
        - type
        - genres
        - image
        - deliveryTypes
        - description
        - minimumSystemRequirements
        - recommendedSystemRequirements
        - developer
        - publisher
        - externalId
        - screenshots
    GameResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Статус запроса
        reason:
          type: string
          description: Причина ошибки
        game:
          description: Игра
          allOf:
            - $ref: "#/components/schemas/GameDetailed"
